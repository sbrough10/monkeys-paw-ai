<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Flappy Bird — tap or press Space to flap through the pipes."
    />
    <title>Flappy Bird</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <h1 class="brand">Flappy Bird</h1>
      <p class="tagline">Tap or press Space to flap</p>
      <div class="stage">
        <canvas id="game" width="400" height="600" role="img" aria-label="Flappy Bird game canvas"></canvas>
        <div id="hud" class="hud" aria-live="polite">
          <span id="score">0</span>
        </div>
        <div id="overlay" class="overlay">
          <p id="overlay-title" class="overlay-title">Ready?</p>
          <p id="overlay-body" class="overlay-body">Flap to start</p>
          <p id="best" class="best">Best: 0</p>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
